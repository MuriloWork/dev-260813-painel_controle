        :root {

            --text-light: #64748b;

            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;

            height: 80px;

        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--text);
        }
        p {
            font-size: 16px;
            color: var(--text-light);
            line-height: 1.6;
            margin: 0 0 32px 0;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            border: none;
            font-size: 16px;
            width: 100%;
        }
        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-light);
            border-top: 1px solid #f1f5f9;
            padding-top: 24px;
        }
        .status {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .status.info { color: var(--primary); display: block; background: #eff6ff; }
        .status.success { color: #059669; display: block; background: #ecfdf5; }
        .status.error { color: #dc2626; display: block; background: #fef2f2; }

    <script>
        const launchBtn = document.getElementById('launchBtn');
        const statusDiv = document.getElementById('status');
        const modelData = JSON.parse(document.getElementById('modelData').textContent);
        const targetAppUrl = "https://termboard.com/app/";
        const targetOrigin = new URL(targetAppUrl).origin;
        
        function setStatus(msg, type) {
            statusDiv.textContent = msg;
            statusDiv.className = 'status ' + type;
        }

        launchBtn.addEventListener('click', () => {
            setStatus('Launching Termboard...', 'info');
            
            // Try to open Termboard
            const termboardWindow = window.open(targetAppUrl, '_blank');
            
            if (!termboardWindow) {
                setStatus('Pop-up blocked! Please allow pop-ups for this page.', 'error');
                return;
            }

            // Set up listener for the ready message
            const handshakeListener = (event) => {
                // origin can be 'null' or 'file://' for local files, so we mainly check the message type
                if (event.data && event.data.type === 'TERMBOARD_READY') {
                    setStatus('Termboard ready. Sending model...', 'info');
                    
                    termboardWindow.postMessage({
                        type: 'TERMBOARD_LOAD_MODEL',
                        payload: modelData
                    }, targetOrigin);
                    
                    setStatus('Model sent successfully!', 'success');
                    window.removeEventListener('message', handshakeListener);
                    
                    // Optionally close this window after a delay
                    setTimeout(() => window.close(), 2000);
                }
            };

            window.addEventListener('message', handshakeListener);

            // Timeout if Termboard doesn't respond
            setTimeout(() => {
                if (statusDiv.className.includes('info')) {
                    setStatus('Handshake timed out. Ensure Termboard is open and try again.', 'error');
                    window.removeEventListener('message', handshakeListener);
                }
            }, 10000);
        });
    </script>
